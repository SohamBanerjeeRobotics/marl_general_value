num_agents: 3
loss: cql
loss_kwargs:
    cql_alpha: 0.1


lr: 0.0001
weight_decay: 0.0001
warmup_epochs: 1000
gamma: 0.95
batch_size: 256
tau: 0.0005
epochs: 100000
eval_interval: 1000
eval_trials: 5

q_config:
    mlp_size: 1024
    head_size: 1024
    dropout: 0
    ensemble_size: 2
    ensemble_reduce: min

task_size: 768
obs_size: 4
act_size: 9
simulator_weights: "data/dynamics_model_weights.eqx"
